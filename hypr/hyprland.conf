$monitorScale = 1
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

source = /home/bozic/.config/hypr/keybinds.conf # keybindings and input
source = /home/bozic/.config/hypr/visuals.conf # visual settings(gaps, borders, colors...)
source = /home/bozic/.config/hypr/monitors.conf # Internal monitor
################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,1.0
# monitor = eDP-1, 2256x1504, 0x0, 1.0
# monitor = DP-2, 2560x1440@240, auto, $monitorScale, cm, srgb #, bitdepth, 10, transform, 0#, cm, hdredid, sdrbrightness, 1.4, sdrsaturation, 0.95  # HOME - CLOSED LID
# monitor = DP-2, 2560x1440, auto, $monitorScale#, bitdepth, 10 # HOME - OPEN LID
# monitor = DP-3, 3840x2160, -792x-2160, $monitorScale # LER
monitor = DP-3, highres, auto, 1.0
#

monitorv2 {
    output = DP-2
    # mode = 2560x1440@240
    mode = preffered, auto, 1.0
    position = 2256x64
    scale = $monitorScale
    # supports_wide_color = 1
    # bitdepth = 10
    # cm = hdr
    # supports_hdr = 0
    # sdr_min_luminance = 0.005
    # sdr_max_luminance = 450
    # sdrsaturation = 1.3
    
}
monitorv2 {
    output = DP-3
    # mode = 2560x1440@240
    mode = preffered, auto, 1.0
    position = 2256x64
    scale = $monitorScale
}

# Set programs that you use
$terminal = alacritty
$fileManager = nautilus
$menu = rofi -show drun
bind = $mainMod, T, exec, $terminal &,
bind = $mainMod, E, exec, $fileManager
# bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, brave --password-store=gnome,
bind = $mainMod, R, exec, hyprlauncher


bind = $mainMod, J, layoutmsg, togglesplit # dwindle

permission = /usr/(bin|local/bin)/hyprpm, plugin, allow # Plugins


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprsunset
exec-once = kdeconnectd & kdeconnect-indicator &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = xwaylandvideobridge &
exec-once = solaar &

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

env = XCURSOR_SIZE,14
env = HYPRCURSOR_THEME, style
env = HYPRCURSOR_SIZE,14


general {
    allow_tearing = true
    layout = dwindle
    
}


# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}


# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 2 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true# If true disables the random hyprland logo / anime girl background. :(
    font_family = "JetBrains Nerd Mono"
    vrr = 1 # vrr support
    animate_manual_resizes = false
    vfr = true# minimize the number of frames being sent to the display when nothing is happening
}


# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}


windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}


windowrule {
    name = waybar
    match:title = waybar
    xray = true
}

windowrule = match:class cs2, immediate yes
layerrule {
    name = waybar
    match:namespace = waybar
    
    blur = true
    blur_popups = true
    above_lock = 1
}

layerrule {
    name = launcher
    match:namespace = hyprlauncher

    blur = true
    blur_popups = true
    dim_around = on
    
}

windowrule {
    name = launcher_border
    match:class = brave

    border_size = 5
}

windowrule {
    name = cubeMX
    match:class = com-st-microxplorer-maingui-STM32CubeMX
    # maximize = on
}
